name: insurance_cdc
version: "1.0.0"
config-version: 2
profile: insurance_cdc

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  insurance_cdc:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

data_tests:
  insurance_cdc:
    +store_failures: true
