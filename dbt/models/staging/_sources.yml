version: 2

sources:
  - name: raw
    description: Append-only change log written by Snowflake Tasks from the legacy Streams.
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'INSURANCE_CDC') }}"
    schema: RAW
    config:
      loaded_at_field: cdc_captured_at
      freshness:
        warn_after: {count: 15, period: minute}
        error_after: {count: 60, period: minute}
    tables:
      - name: policy_changes
        description: Every insert (I), update (U) and delete (D) on LEGACY.POLICIES.
        columns:
          - name: change_id
            data_tests: [unique, not_null]
          - name: cdc_operation
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['I', 'U', 'D']
      - name: endorsement_changes
        description: Every change on LEGACY.ENDORSEMENTS.
        columns:
          - name: change_id
            data_tests: [unique, not_null]

  - name: legacy
    description: The simulated legacy system. Read only for reconciliation tests.
    database: "{{ env_var('SNOWFLAKE_DATABASE', 'INSURANCE_CDC') }}"
    schema: LEGACY
    tables:
      - name: policies
      - name: endorsements
