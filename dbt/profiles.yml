# Credentials come from environment variables, never from this file.
insurance_cdc:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'not-set') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'SVC_CDC') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', 'not-set') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'CDC_ENGINEER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'WH_CDC') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'INSURANCE_CDC') }}"
      schema: ANALYTICS
      threads: 4
    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'not-set') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'SVC_CDC') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', 'not-set') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'CDC_ENGINEER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'WH_CDC') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'INSURANCE_CDC') }}"
      schema: "CI_{{ env_var('GITHUB_RUN_ID', 'local') }}"
      threads: 4
